<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Snap Match</title>
<style>
:root{
  --bg:#F2F2F7;--surface:#FFFFFF;--glass:rgba(255,255,255,.72);
  --label:#000000;--label-2:rgba(60,60,67,.60);--separator:rgba(60,60,67,.29);
  --fill:rgba(120,120,128,.16);--tint:#007AFF;--shadow:0 8px 24px rgba(0,0,0,.08);
  --t-yellow:#FFCC00;--t-green:#34C759;--t-orange:#FF9500;
  --t-red:#FF3B30;--t-blue:#007AFF;--t-purple:#AF52DE;
  --tsh:.12;--scrn:rgba(242,242,247,.5);
  --page-tint:radial-gradient(120% 60% at 50% 0%,rgba(0,122,255,.06),transparent 60%);
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.55,0,1,.45);
  --spring:cubic-bezier(.34,1.56,.64,1);--spring-soft:cubic-bezier(.32,1.25,.6,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --bw:358px;--cell:38px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000;--surface:#1C1C1E;--glass:rgba(44,44,46,.66);
  --label:#FFFFFF;--label-2:rgba(235,235,245,.60);--separator:rgba(84,84,88,.60);
  --fill:rgba(120,120,128,.32);--tint:#0A84FF;--shadow:0 8px 24px rgba(0,0,0,.45);
  --t-yellow:#FFD60A;--t-green:#30D158;--t-orange:#FF9F0A;
  --t-red:#FF453A;--t-blue:#0A84FF;--t-purple:#BF5AF2;
  --tsh:.35;--scrn:rgba(0,0,0,.5);--page-tint:none;
}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:var(--page-tint),var(--bg);background-color:var(--bg);color:var(--label);font-family:var(--font);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--tint);outline-offset:3px}

#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(12px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
#side{width:var(--bw);display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:6px}
.brand{font-size:17px;font-weight:600;letter-spacing:-.2px}
.tools{display:flex;gap:8px;margin-right:-2px}
.icon{width:44px;height:44px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--tint);
  transition:transform 160ms var(--spring),opacity 160ms}
.icon:active{transform:scale(.96);opacity:.7;transition-duration:80ms;transition-timing-function:var(--ease-out)}
.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);column-gap:8px;align-items:end}
.stat{display:flex;flex-direction:column;position:relative}
.stat.mid{align-items:center}.stat.end{align-items:flex-end}
.cap{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--label-2);line-height:18px}
.lt{font-size:min(34px,calc(var(--bw)*.095));white-space:nowrap;font-weight:700;letter-spacing:.37px;line-height:41px;transform-origin:left center}
.tm{font-size:28px;font-weight:700;line-height:41px;min-width:2ch;text-align:center}
.val{font-size:17px;font-weight:600;line-height:41px;white-space:nowrap}
.track{height:6px;border-radius:3px;background:var(--fill);margin-top:8px;overflow:hidden}
#bar{height:100%;width:100%;border-radius:3px;background:var(--tint);transform-origin:left center;will-change:transform}
.hud.low .tm{color:var(--t-red)}
.low-bar #bar{background:var(--t-red)}
.tbonus{position:absolute;top:14px;left:100%;margin-left:4px;font:700 15px var(--round);color:var(--t-green);white-space:nowrap;pointer-events:none}

#board{position:relative;width:var(--bw);height:var(--bw);border-radius:calc(var(--cell)*.26 + var(--pad,10px));background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 0 0 .5px var(--separator),var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;contain:layout;outline:none}
#cells,#tiles,#fx{position:absolute;inset:0;pointer-events:none}
#fx{z-index:5}
.cell{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);border-radius:26%;background:var(--fill)}
.tile{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);will-change:transform}
.in{position:relative;width:100%;height:100%;border-radius:26%;display:grid;place-items:center;color:#fff;
  background-color:var(--c);
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--c) 82%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 92%,#000) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 4px rgba(0,0,0,var(--tsh));
  transition:transform 160ms var(--spring);will-change:transform}
.dk .in{color:#5C4400}
.in svg{position:absolute;z-index:1;left:18%;top:18%;width:64%;height:64%;display:block;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.in::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 3px var(--surface),0 0 0 5.5px var(--tint);opacity:0;transition:opacity 100ms linear;pointer-events:none}
.tile.sel{z-index:2}
.tile.sel .in{transform:scale(1.08)}
.tile.sel .in::after{opacity:1}
@media (hover:hover) and (pointer:fine){
  .tile.hov .in{transform:translateY(-2px) scale(1.04)}
  .tile.sel.hov .in{transform:translateY(-2px) scale(1.08)}
}
.tile.pr .in{transform:scale(.94);transition-duration:80ms;transition-timing-function:var(--ease-out)}
.tile.sel.pr .in{transform:scale(1.02)}
.line-h .in::before,.line-v .in::before{content:"";position:absolute;opacity:.6;border:0 solid currentColor}
.line-h .in::before{left:9%;right:9%;top:31%;bottom:31%;border-top-width:2.5px;border-bottom-width:2.5px}
.line-v .in::before{top:9%;bottom:9%;left:31%;right:31%;border-left-width:2.5px;border-right-width:2.5px}
.burst .in{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 12px 1px color-mix(in srgb,var(--c) 75%,transparent),0 2px 4px rgba(0,0,0,var(--tsh))}
.burst .in::before{content:"";position:absolute;inset:8%;border-radius:22%;border:2px solid rgba(255,255,255,.95);
  box-shadow:0 0 6px rgba(255,255,255,.9),inset 0 0 6px rgba(255,255,255,.7);animation:glow 1.2s ease-in-out infinite alternate}
.dk.burst .in::before{border-color:rgba(92,68,0,.8)}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.flash{position:absolute;inset:0;border-radius:inherit;background:#fff;pointer-events:none;z-index:2}
.beam{position:absolute;border-radius:12px;--bc:color-mix(in srgb,var(--c,#fff) 30%,#fff);
  background:linear-gradient(var(--bdir,90deg),rgba(255,255,255,0),var(--bc) 18%,var(--bc) 82%,rgba(255,255,255,0));
  box-shadow:0 0 18px color-mix(in srgb,var(--c,#fff) 75%,transparent);pointer-events:none}
.streak{position:absolute;left:0;top:0;border-radius:999px;pointer-events:none;transform-origin:0 0;
  background:linear-gradient(90deg,rgba(255,255,255,0),color-mix(in srgb,var(--c) 60%,#fff) 50%,#fff 90%);
  box-shadow:0 0 14px color-mix(in srgb,var(--c) 85%,transparent)}
.ring{position:absolute;border-radius:50%;border:3px solid color-mix(in srgb,var(--c,#fff) 30%,#fff);pointer-events:none;
  box-shadow:0 0 16px color-mix(in srgb,var(--c,#fff) 80%,transparent),inset 0 0 12px color-mix(in srgb,var(--c,#fff) 50%,#fff)}
.ring.thin{border-width:1.5px}
.glow{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 14%,transparent) 40%,color-mix(in srgb,var(--c) 60%,transparent) 68%,color-mix(in srgb,var(--c) 20%,transparent) 84%,transparent)}
.edge{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ec) 80%,transparent),inset 0 0 22px color-mix(in srgb,var(--ec) 45%,transparent),0 0 24px color-mix(in srgb,var(--ec) 40%,transparent)}
#pfx{position:absolute;left:-48px;top:-48px;pointer-events:none;z-index:4}
.shim{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:2}
.shim i{position:absolute;top:-30%;bottom:-30%;left:0;width:42%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.9),rgba(255,255,255,0));
  transform:translateX(-140%) skewX(-18deg)}
/* Combo strip: fixed-height row between HUD and board (side column in landscape). Holds the combo word
   and the step's "+N" so no text ever covers the tiles; height is reserved so nothing jumps. */
#combo{position:relative;height:48px;display:flex;align-items:center;justify-content:center;gap:10px;pointer-events:none;white-space:nowrap}
#toast{padding:7px 16px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 0 0 .5px var(--separator),var(--shadow);font:700 18px/22px var(--round);color:var(--label);white-space:nowrap;opacity:0}
#toast.tinted{color:var(--ec)}
#pts{font:800 22px/26px var(--round);font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--c,var(--label)) 65%,#000);opacity:0}
@media (prefers-color-scheme:dark){#pts{color:color-mix(in srgb,var(--c,var(--label)) 75%,#fff)}}
.kcur{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);border-radius:26%;outline:2.5px dashed var(--tint);outline-offset:3px;pointer-events:none}
.foot{width:var(--bw);margin-top:10px;text-align:center;font-size:13px;color:var(--label-2);min-height:18px}

.btn{display:block;width:100%;max-width:340px;height:50px;border-radius:25px;font-size:17px;font-weight:600;
  transition:transform 160ms var(--spring),opacity 160ms}
.btn:active{transform:scale(.96);opacity:.7;transition-duration:80ms;transition-timing-function:var(--ease-out)}
.pri{background:var(--tint);color:#fff}
.sec{background:var(--fill);color:var(--tint)}

.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--scrn);
  -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%)}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;text-align:center}
.card h1{font-size:34px;font-weight:700;letter-spacing:.37px;margin:18px 0 6px}
.card h2{font-size:28px;font-weight:700;margin-bottom:6px}
.card p{font-size:17px;color:var(--label-2);line-height:1.35;margin-bottom:22px}
.minis{display:flex;gap:6px}
.minis .tile{position:relative;width:34px;height:34px}
.bestline{font-size:15px;color:var(--label-2);margin-bottom:18px}
.bestline b{color:var(--label);font-weight:600}

#scrim{position:fixed;inset:0;z-index:30;background:#000;opacity:.4}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;margin:0 auto;max-width:560px;background:var(--surface);border-radius:16px 16px 0 0;
  padding:8px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 -8px 30px rgba(0,0,0,.18);will-change:transform;touch-action:none}
.grab{width:36px;height:5px;border-radius:2.5px;background:var(--separator);margin-bottom:10px}
#sheet h2{font-size:28px;font-weight:700}
.esc{font-size:34px;font-weight:700;letter-spacing:.37px;line-height:41px}
.chip{font-size:13px;font-weight:600;background:var(--t-yellow);color:#000;border-radius:10px;padding:3px 10px}
.sub{font-size:17px;color:var(--label-2);margin-bottom:8px}
#sheet .btn{margin-top:2px}
.acts{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
@media (max-height:440px){
  #sheet{gap:4px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .grab{margin-bottom:2px}#sheet h2{font-size:22px}.esc{font-size:30px;line-height:36px}.sub{margin-bottom:4px}
  .acts{flex-direction:row;max-width:480px}.acts .btn{flex:1}
}

/* Home badge: one fixed link above every layer (screens z20, scrim z30, sheet z31) */
.home-badge{position:fixed;z-index:40;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));
  width:44px;height:44px;display:grid;place-items:center;border-radius:12px;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;touch-action:manipulation;outline:none;
  transition:transform 160ms var(--spring),opacity 160ms}
.home-badge::before{content:"";position:absolute;inset:2px;border-radius:11px;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 0 0 .5px var(--separator),0 2px 8px rgba(0,0,0,.08)}
.home-badge img{position:relative;width:27px;height:27px;display:block;pointer-events:none;-webkit-user-drag:none}
.home-badge:active{transform:scale(.9);opacity:.7;transition-duration:80ms;transition-timing-function:var(--ease-out)}
.home-badge:focus-visible::before{box-shadow:0 0 0 .5px var(--separator),0 0 0 2px var(--bg),0 0 0 4px var(--tint)}
@media (prefers-color-scheme:dark){
  .home-badge::before{box-shadow:0 0 0 .5px var(--separator),0 2px 8px rgba(0,0,0,.4)}
  .home-badge img{filter:brightness(1.45) saturate(1.05)}
}
/* Badge clearance (toggled by JS only when the column would actually reach the badge's corner):
   portrait reserves a row above the brand row; landscape reserves a column left of the side panel. */
html.badge-row #app{padding-top:calc(max(12px,env(safe-area-inset-top)) + 48px)}
html.badge-col #app{padding-left:calc(max(12px,env(safe-area-inset-left)) + 52px)}

html.land #app{flex-direction:row;gap:24px}
html.land #side{width:220px}
html.land #combo{height:88px;flex-direction:column;gap:6px;margin-top:10px}
html.land .hud{grid-template-columns:1fr 1fr;row-gap:2px}
html.land .hud .stat:first-child{grid-column:1/-1}
html.land .stat.mid{align-items:flex-start}
html.land .lt{font-size:34px}
html.land .foot{display:none}
@media (prefers-reduced-motion:reduce){
  .in,.btn,.icon,.home-badge{transition:opacity 120ms linear!important}
  .tile.sel .in,.tile.pr .in,.tile.hov .in,.btn:active,.icon:active,.home-badge:active{transform:none}
  .burst .in::before{animation:none}
}
</style>
</head>

<script>
/* Snap Match - procedural SFX (WebAudio only, no files).
   Glossy ceramic/acrylic tile clacks + pentatonic glass chimes.
   Global API: window.SFX (see bottom). Every call is a safe no-op when
   muted, locked or when WebAudio is unavailable, and never throws. */
(function () {
  "use strict";

  /* ---------- State ---------- */
  var ctx = null, bus = null, noiseBuf = null, voices = 0, test = false;
  var MAX_VOICES = 40;                       // oscillator/noise sources alive at once
  var landWin = { t: -1, n: 0 };             // landing-clack throttle window
  var MASTER = 0.8, muted = false;
  try { muted = localStorage.getItem("m3.mute") === "1"; } catch (e) {}

  /* ---------- Master bus: gain -> comp -> soft limiter (+ tiny room) ---------- */
  function build(c) {
    ctx = c; voices = 0; landWin = { t: -1, n: 0 };
    var comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4;
    comp.attack.value = 0.002; comp.release.value = 0.15;
    // Soft clipper: unity for small signals, asymptote at 0.88 (~ -1.1 dBFS).
    var pre = c.createGain(); pre.gain.value = 0.5;
    var lim = c.createWaveShaper(), n = 2048, curve = new Float32Array(n);
    for (var i = 0; i < n; i++) { var x = i / (n - 1) * 2 - 1; curve[i] = 0.88 * Math.tanh(2 * x / 0.88); }
    lim.curve = curve; lim.oversample = "2x";
    bus = c.createGain(); bus.gain.value = muted ? 0 : MASTER;
    bus.connect(comp); comp.connect(pre); pre.connect(lim); lim.connect(c.destination);
    // "Room": short feedback delay, darkened, low mix - adds gloss without mud.
    var dl = c.createDelay(0.2), fb = c.createGain(), lp = c.createBiquadFilter(), wet = c.createGain();
    dl.delayTime.value = 0.029; fb.gain.value = 0.2; lp.type = "lowpass"; lp.frequency.value = 3200; wet.gain.value = 0.07;
    bus.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(wet); wet.connect(comp);
    noiseBuf = c.createBuffer(1, (c.sampleRate * 0.5) | 0, c.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var j = 0; j < d.length; j++) d[j] = Math.random() * 2 - 1;
  }

  function ready() { return !!(ctx && bus && !muted && (test || ctx.state === "running") && voices < MAX_VOICES); }
  function now() { return ctx.currentTime + (test ? 0.1 : 0.005); }   // test: skip compressor warm-up
  function vary(a) { return 1 + (Math.random() * 2 - 1) * a; }           // tiny humanize
  function out(col, extra) {                                              // per-sound panned output
    var g = ctx.createGain(); g.gain.value = vary(0.08);
    var p = (typeof col === "number" && isFinite(col)) ? Math.max(-1, Math.min(1, (col - 3.5) / 3.5)) * 0.45 : 0;
    p = Math.max(-0.6, Math.min(0.6, p + (extra || 0)));
    if (ctx.createStereoPanner) { var s = ctx.createStereoPanner(); s.pan.value = p; g.connect(s); s.connect(bus); }
    else g.connect(bus);
    return g;
  }
  function track(src, end, nodes) {
    voices++; src.onended = function () { voices--; try { nodes.forEach(function (n) { n.disconnect(); }); } catch (e) {} };
    src.start(Math.max(0, end[0])); src.stop(end[1]);
  }

  /* ---------- Voice primitives ---------- */
  // Sine/triangle partial with fast attack + exponential decay (modal resonance).
  function tone(dest, t, f, dur, gain, type, f2) {
    if (voices >= MAX_VOICES) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur * 0.8);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); track(o, [t, t + dur + 0.02], [o, g]);
  }
  // Filtered noise burst (the "contact" of a clack, or a whoosh with sweep f->f2).
  function burst(dest, t, f, q, dur, gain, type, f2, atk) {
    if (voices >= MAX_VOICES) return;
    var s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; fl.type = type || "bandpass"; fl.Q.value = q; fl.frequency.setValueAtTime(f, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    atk = atk || 0.001;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(dest);
    voices++; s.onended = function () { voices--; try { g.disconnect(); fl.disconnect(); } catch (e) {} };
    s.start(t, Math.random() * 0.3); s.stop(t + dur + 0.02);
  }
  // Ceramic tile clack: bright contact click + inharmonic bar modes (1 : 2.76 : 5.40) + small body knock.
  function clack(dest, t, pitch, g) {
    pitch *= vary(0.04); g *= vary(0.1);
    var f = 1900 * pitch;
    burst(dest, t, 3400 * pitch, 1.4, 0.016, g * 0.55);
    tone(dest, t, f, 0.045, g * 0.32);
    tone(dest, t, f * 2.756, 0.026, g * 0.13);
    tone(dest, t, f * 5.404, 0.012, g * 0.05);
    tone(dest, t, 430 * pitch, 0.03, g * 0.18, "triangle");
  }
  // Glass chime: fundamental + octave + soft upper partial, slight detune for shimmer.
  function chime(dest, t, f, g, dec, bright) {
    f *= vary(0.004); bright = bright || 1;
    tone(dest, t, f, dec, g * 0.5);
    tone(dest, t, f * 1.003, dec * 0.8, g * 0.18, "triangle");
    tone(dest, t, f * 2.001, dec * 0.55, g * 0.22 * bright);
    tone(dest, t, f * 3.98, dec * 0.3, g * 0.07 * bright);
  }
  // Major pentatonic from C5; index can go up across octaves.
  var PENT = [0, 2, 4, 7, 9];
  function note(i) { i = Math.max(0, i | 0); return 523.25 * Math.pow(2, (12 * Math.floor(i / 5) + PENT[i % 5]) / 12); }

  // Wrap each public sound: gate + try/catch so callers never see errors.
  function safe(fn) { return function () { if (!ready()) return; try { fn.apply(null, arguments); } catch (e) {} }; }

  /* ---------- Sounds ---------- */
  var S = {};
  S.select = safe(function (col) { clack(out(col), now(), 1.18, 0.22); });

  S.swap = safe(function (col) {
    var o = out(col), t = now();
    burst(o, t, 1800, 0.8, 0.045, 0.035, "bandpass", 2600, 0.025); // slide
    clack(o, t + 0.035, 1.0, 0.36);                                 // kiss
    clack(o, t + 0.042, 0.9, 0.2);
  });

  S.invalid = safe(function (col) {
    var o = out(col), t = now();
    [0, 0.085].forEach(function (d, i) {                           // dull double knock
      var g = i ? 0.22 : 0.32;
      tone(o, t + d, 240 * vary(0.03), 0.07, g, "triangle", 200);
      burst(o, t + d, 900, 1.2, 0.03, g * 0.6, "lowpass");
    });
  });

  S.land = safe(function (col, row, intensity) {
    var t = ctx.currentTime;
    if (t - landWin.t > 0.03) { landWin.t = t; landWin.n = 0; }
    if (landWin.n >= 4) return;                                     // throttle cascades
    landWin.n++;
    var k = Math.max(0, Math.min(1, +intensity || 0.5));
    var g = (0.1 + 0.22 * k) / Math.sqrt(landWin.n);
    var r = (typeof row === "number") ? row : 4;
    clack(out(col), now() + (landWin.n - 1) * 0.006, 0.86 + 0.012 * r, g);
  });

  S.match = safe(function (size, step, col) {
    var o = out(col), t = now(), n = Math.max(3, Math.min(+size || 3, 6)), s = Math.max(1, Math.min(+step || 1, 6));
    for (var i = 0; i < Math.min(n, 4); i++) clack(o, t + i * 0.014, 1.05 + i * 0.05 + s * 0.03, 0.26 - i * 0.03);
    var base = (s - 1) * 1 + 2, bright = 0.8 + s * 0.15, notes = [base, base + 2];
    if (n >= 4) notes.push(base + 4);
    if (n >= 5) notes.push(base + 7);
    notes.forEach(function (ni, k) { chime(o, t + 0.03 + k * 0.03, note(ni), 0.2 - k * 0.025, 0.42, bright); });
  });

  S.special = safe(function (kind, col) {
    var t = now();
    if (kind === "line") {
      var o = out(col);
      burst(o, t, 500, 1.5, 0.28, 0.12, "bandpass", 5200, 0.08);   // whoosh sweep
      tone(o, t + 0.06, 2350, 0.36, 0.08, "sine", 3500);           // glassy zing (detuned pair)
      tone(o, t + 0.06, 2364, 0.32, 0.06, "triangle", 3520);
      chime(o, t + 0.12, note(12), 0.1, 0.35, 1.2);
    } else {
      var b = out(col);
      tone(b, t, 120, 0.28, 0.32, "sine", 52);                     // soft low thump
      burst(b, t, 300, 0.7, 0.08, 0.12, "lowpass");
      for (var i = 0; i < 5; i++)                                   // sparkle
        tone(out(col, (Math.random() - 0.5) * 0.6), t + 0.05 + i * 0.035, note(10 + ((Math.random() * 6) | 0)), 0.16, 0.05);
    }
  });

  S.create = safe(function (kind, col) {
    var o = out(col), t = now(), b = kind === "burst" ? 3 : 5;
    burst(o, t, 2500, 1, 0.3, 0.025, "highpass", 7000, 0.15);       // airy rise
    for (var i = 0; i < 5; i++) tone(o, t + i * 0.045, note(b + i * 2), 0.18, 0.06 + i * 0.008, "triangle");
  });

  S.combo = safe(function (step) {
    var s = Math.max(2, Math.min(+step || 2, 6)), t = now(), cnt = Math.min(3 + s, 8), st = 3 + s;
    for (var i = 0; i < cnt; i++) chime(out(undefined, (i / cnt - 0.5) * 0.5), t + i * 0.042, note(st + i), 0.09 + 0.01 * s, 0.32, 1 + 0.1 * s);
  });

  S.settle = safe(function () {
    var o = out(), t = now();
    clack(o, t, 0.62, 0.2);                                         // tock (woody, low)
    tone(o, t, 330, 0.06, 0.1, "triangle");
    chime(o, t + 0.09, note(9), 0.1, 0.3, 0.8);                     // tink (resolves to A5/C6)
  });

  S.tick = safe(function () {
    var o = out(), t = now();                                       // quiet woodblock
    burst(o, t, 1200, 6, 0.03, 0.03);
    tone(o, t, 920, 0.04, 0.035, "sine"); tone(o, t, 920 * 2.6, 0.02, 0.01);
  });

  S.hint = safe(function () {
    var o = out(), t = now();
    tone(o, t, note(15), 0.13, 0.05); tone(o, t, note(15) * 2.003, 0.08, 0.02);
  });

  S.start = safe(function () {
    var o = out(), t = now();
    burst(o, t, 300, 1.2, 0.26, 0.1, "bandpass", 3200, 0.16);      // whoosh up
    tone(o, t + 0.22, 620, 0.12, 0.2, "sine", 1050);                // pop
    clack(o, t + 0.22, 1.1, 0.22);
    chime(o, t + 0.26, note(7), 0.1, 0.35);
  });

  S.end = safe(function (isBest) {
    var t = now(), seq = isBest ? [0, 2, 4, 5, 7, 10] : [0, 2, 4, 5], gap = isBest ? 0.08 : 0.1;
    seq.forEach(function (ni, i) { chime(out(undefined, (i / seq.length - 0.5) * 0.6), t + i * gap, note(ni), 0.13, 0.7, 1); });
    var tf = t + seq.length * gap, chord = isBest ? [0, 2, 4, 10] : [0, 2, 4];
    chord.forEach(function (ni) { chime(out(), tf, note(ni + 5) * 0.5, 0.09, 1.0, 0.7); });   // resolving chord
  });

  /* ---------- Public API ---------- */
  // Resume a suspended/"interrupted" (iOS) context. Cheap no-op when already running.
  var kicked = false;
  function wake() {
    if (!ctx || ctx.state === "running" || ctx.state === "closed" || !ctx.resume) return;
    try { var p = ctx.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }

  try {
    document.addEventListener("visibilitychange", function () {
      if (!ctx || test) return;
      if (document.hidden) return;
      if (!muted) wake();
    });
  } catch (e) {}

  window.SFX = {
    // Called on every pointerdown/keydown: creates the context once, then only resumes if needed.
    unlock: function () {
      try {
        if (!ctx) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return; build(new C()); }
        if (!kicked) {                                       // iOS kick: one silent buffer inside the first gesture
          kicked = true;
          var s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, ctx.sampleRate); s.connect(ctx.destination); s.start(0);
        }
        wake();
      } catch (e) {}
    },
    setMuted: function (m) {
      muted = !!m;
      try { localStorage.setItem("m3.mute", muted ? "1" : "0"); } catch (e) {}
      try { if (bus) bus.gain.setTargetAtTime(muted ? 0 : MASTER, ctx.currentTime, 0.02); } catch (e) {}
      if (!muted) wake();
    },
    isMuted: function () { return muted; },
    select: S.select, swap: S.swap, invalid: S.invalid, land: S.land, match: S.match,
    special: S.special, create: S.create, combo: S.combo, settle: S.settle,
    tick: S.tick, hint: S.hint, start: S.start, end: S.end,
    // Test hook: render into an injected (Offline)AudioContext.
    _renderTest: function (c) { try { test = true; muted = false; build(c); } catch (e) {} }
  };
})();
</script>
<script>
(function(){
"use strict";
const N=8, NT=6, COLORS=["yellow","green","orange","red","blue","purple"];
const EO="cubic-bezier(.22,1,.36,1)", EI="cubic-bezier(.55,0,1,.45)", SP="cubic-bezier(.34,1.56,.64,1)", SS="cubic-bezier(.32,1.25,.6,1)";
const $=id=>document.getElementById(id);
const boardEl=$("board"), cellsEl=$("cells"), tilesEl=$("tiles"), fxEl=$("fx");
const scoreEl=$("score"), timeEl=$("time"), bestEl=$("best"), barEl=$("bar"), trackEl=$("track"), hudEl=$("hud");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=n=>Math.round(n).toLocaleString("en-US");
let mq=null; try{mq=window.matchMedia("(prefers-reduced-motion: reduce)");}catch(e){}
let RM=!!(mq&&mq.matches);
try{mq&&mq.addEventListener("change",e=>{RM=e.matches;});}catch(e){}

/* ---------- RNG & storage ---------- */
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
let seed=Date.now()>>>0;
try{const s=new URLSearchParams(location.search).get("seed");if(s)seed=(parseInt(s,10)||0)>>>0;}catch(e){}
const rand=rng(seed), ri=n=>Math.floor(rand()*n);
const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem(k);if(v!==null)return v;}catch(e){}return k in mem?mem[k]:d;},
  set(k,v){mem[k]=String(v);try{localStorage.setItem(k,String(v));}catch(e){}}
};

/* ---------- Audio & haptics ---------- */
let muted=store.get("m3.mute","0")==="1";
/* Sound hooks -> window.SFX (inlined module above). Positional args named `col` are the BOARD COLUMN 0..7
   (fractional allowed for midpoints/centers); SFX maps it to stereo pan. */
function sound(name){
  try{const S=window.SFX;if(S&&typeof S[name]==="function")S[name].apply(S,Array.prototype.slice.call(arguments,1));}catch(e){}
}
const unlockAudio=()=>sound("unlock");

const appEl=$("app"), sideEl=$("side"), footEl=$("foot");
/* Board fills the free space: up to min(viewport - gutters, 560), never taller than what is left under
   HUD + combo strip (+ hint line). Gutters/safe areas come from #app's padding, the rest is measured. */
function computeTileSize(){
  const vw=window.innerWidth, vh=window.innerHeight, H=document.documentElement;
  let sl=0;
  try{const cs=getComputedStyle(probe);sl=parseFloat(cs.paddingLeft)||0;}catch(e){}
  const land=vh<500&&vw>vh, badgeR=Math.max(12,sl)+44+4;
  H.classList.toggle("land",land);
  const fit=()=>{
    const cs=getComputedStyle(appEl), n=k=>parseFloat(cs[k])||0;
    const pl=n("paddingLeft"), pr=n("paddingRight"), pt=n("paddingTop"), pb=n("paddingBottom");
    let w,h;
    if(land){w=vw-pl-pr-sideEl.offsetWidth-(parseFloat(cs.columnGap)||24);h=vh-pt-pb;}
    else{const fh=footEl.offsetHeight?footEl.offsetHeight+(parseFloat(getComputedStyle(footEl).marginTop)||0):0;
      w=vw-pl-pr;h=vh-pt-pb-sideEl.offsetHeight-fh;}
    const bw=Math.max(200,Math.floor(Math.min(w,h,560)));
    const left=land?pl+(vw-pl-pr-(sideEl.offsetWidth+(parseFloat(cs.columnGap)||24)+bw))/2:(vw-bw)/2;
    return {bw,left};
  };
  H.classList.remove("badge-row","badge-col");
  let f=fit();
  if(f.left<badgeR){H.classList.add(land?"badge-col":"badge-row");f=fit();}
  const bw=f.bw;
  // compact well spacing on phone-size boards so the tiles themselves get the pixels
  if(bw<440){PAD=6;GAP=4;}else{PAD=10;GAP=6;}
  BW=bw;CELL=(bw-2*PAD-7*GAP)/8;PITCH=CELL+GAP;
  const rs=H.style;
  rs.setProperty("--bw",bw+"px");rs.setProperty("--cell",CELL+"px");rs.setProperty("--pad",PAD+"px");
  sizeCanvas();
  layoutAll();
}

const PM=48, PMAX=80, pool=[];
const pcv=document.createElement("canvas");pcv.id="pfx";pcv.setAttribute("aria-hidden","true");boardEl.insertBefore(pcv,fxEl);
const pctx=pcv.getContext("2d");

for(let i=0;i<PMAX;i++)pool.push({on:false,t:0,life:1});
let pRaf=0, pLast=0, dpr=1, COLV=[], COLL=[];
function readColors(){
  try{
    const cs=getComputedStyle(document.documentElement);
    COLV=COLORS.map(n=>cs.getPropertyValue("--t-"+n).trim()||"#8E8E93");
    COLL=COLV.map(h=>{const m=/^#?([0-9a-f]{6})$/i.exec(h);if(!m)return h;const v=parseInt(m[1],16);
      const f=x=>Math.round(x+(255-x)*.45);return "rgb("+f(v>>16)+","+f((v>>8)&255)+","+f(v&255)+")";});
  }catch(e){}
}
function sizeCanvas(){
  dpr=Math.min(2,window.devicePixelRatio||1);const s=BW+2*PM;
  pcv.style.width=pcv.style.height=s+"px";pcv.width=pcv.height=Math.round(s*dpr);
}
function spawnP(x,y,vx,vy,col,size,life,delay,round){
  let p=null;
  for(const q of pool){if(!q.on){p=q;break;}if(!p||q.t/q.life>p.t/p.life)p=q;}  // free slot, else recycle the oldest
  p.on=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.col=col;p.size=size;p.life=life;p.t=0;p.delay=delay||0;p.round=round;
  p.rot=Math.random()*6.283;p.vr=(Math.random()-.5)*14;
}
function pFrame(now){
  const dt=Math.min(.033,Math.max(0,(now-pLast)/1000));pLast=now;
  const g=1500*(PITCH/44), d=dpr;
  pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,pcv.width,pcv.height);
  let n=0;
  for(const p of pool){
    if(!p.on)continue;n++;
    if(p.delay>0){p.delay-=dt;continue;}
    p.t+=dt;if(p.t>=p.life){p.on=false;continue;}
    p.vy+=g*dt;p.vx*=1-2*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    const k=p.t/p.life, s=p.size*(1-.4*k);
    pctx.globalAlpha=k<.5?1:1-(k-.5)/.5;pctx.fillStyle=p.col;
    const c=Math.cos(p.rot), si=Math.sin(p.rot);
    pctx.setTransform(d*c,d*si,-d*si,d*c,(PM+p.x)*d,(PM+p.y)*d);
    pctx.beginPath();
    if(p.round)pctx.arc(0,0,s/2,0,6.2832);
    else if(pctx.roundRect)pctx.roundRect(-s/2,-s/2,s,s,s*.3);
    else pctx.rect(-s/2,-s/2,s,s);
    pctx.fill();
  }
  pctx.globalAlpha=1;

}
function kickP(){if(!pRaf){pLast=performance.now();pRaf=requestAnimationFrame(pFrame);}}
// burst from a set of tile centers: evenly spread angles, upward bias, gravity does the rest
function burstP(pts,type,n,delay,power){
  if(RM||!pts.length)return;
  const s=PITCH/44, a0=Math.random()*6.283;
  for(let i=0;i<n;i++){
    const o=pts[(Math.random()*pts.length)|0], ang=a0+i/n*6.283+(Math.random()-.5)*.5, sp=(120+Math.random()*150)*s*power;
    spawnP(o[0]+(Math.random()-.5)*CELL*.35,o[1]+(Math.random()-.5)*CELL*.35,Math.cos(ang)*sp,Math.sin(ang)*sp-170*s,
      i%3===2?COLL[type]:COLV[type],(3.5+Math.random()*2.5)*s*(power>1?1.3:1),.42+Math.random()*.22,delay/1000,i%4===3);
  }

}

/* Stretch along travel mid-slide (front tile lifts, back tile dips), then a soft "kiss" squash on arrival
   that springs back. Tail runs ~120ms past the slide; a following clear pop simply overrides it. */
function swapSquash(t,o,dur,k,depth){
  const dx=t.c-o.c, dy=t.r-o.r, hz=dx!==0, tot=dur+120, p=dur/tot;
  const org=hz?(dx>0?"100% 50%":"0% 50%"):(dy>0?"50% 100%":"50% 0%");
  const S=(al,cr,z)=>"scale("+((hz?al:cr)*z).toFixed(3)+","+((hz?cr:al)*z).toFixed(3)+")";
  const z=1+.045*k*depth;
  t.inn.animate([
    {transform:"scale(1,1)",transformOrigin:org,easing:"ease-out"},
    {transform:S(1+.09*k,1-.06*k,z),transformOrigin:org,offset:p*.5,easing:"ease-in"},
    {transform:S(1-.08*k,1+.05*k,1),transformOrigin:org,offset:p,easing:"ease-out"},
    {transform:S(1+.02*k,1-.015*k,1),transformOrigin:org,offset:p+(1-p)*.5,easing:"ease-in-out"},
    {transform:"scale(1,1)",transformOrigin:org}

}

    {transform:"scale(1,1)",transformOrigin:O}],{duration:210});
}
function animateDrops(list){

  for(const o of list)if(o.spawn){
    const s=o.t.el.style;s.transition="none";s.opacity="0";s.transform=tf(o.from,o.t.c);
    if(!o.t.el.parentNode)tilesEl.appendChild(o.t.el);

/* ---------- Board logic ---------- */
function genTypes(){
  const g=[];
  for(let r=0;r<N;r++){g[r]=[];for(let c=0;c<N;c++){
    let t,k=0;
    do{t=ri(NT);}while(k++<60&&((c>=2&&g[r][c-1]===t&&g[r][c-2]===t)||(r>=2&&g[r-1][c]===t&&g[r-2][c]===t)));
    g[r][c]=t;
  }}
  return g;
}
function genBoard(){let g;for(let i=0;i<60;i++){g=genTypes();if(movesOf(g).length)break;}return g;}
function matchAt(g,r,c){
  const t=g[r][c];if(t<0)return false;
  let n=1;for(let x=c-1;x>=0&&g[r][x]===t;x--)n++;for(let x=c+1;x<N&&g[r][x]===t;x++)n++;if(n>=3)return true;
  n=1;for(let y=r-1;y>=0&&g[y][c]===t;y--)n++;for(let y=r+1;y<N&&g[y][c]===t;y++)n++;return n>=3;
}
function movesOf(g){
  const out=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const d of [[0,1],[1,0]]){
    const r2=r+d[0],c2=c+d[1];if(r2>=N||c2>=N||g[r][c]===g[r2][c2])continue;
    let tmp=g[r][c];g[r][c]=g[r2][c2];g[r2][c2]=tmp;
    if(matchAt(g,r,c)||matchAt(g,r2,c2))out.push([[r,c],[r2,c2]]);
    tmp=g[r][c];g[r][c]=g[r2][c2];g[r2][c2]=tmp;
  }
  return out;
}
const typed=()=>grid.map(row=>row.map(t=>t?t.type:-1));
const allMoves=()=>movesOf(typed());
const tileAt=k=>grid[(k/N)|0][k%N];

function findMatches(){
  const runs=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){const t=grid[r][c];if(!t){c++;continue;}let e=c+1;
    while(e<N&&grid[r][e]&&grid[r][e].type===t.type)e++;
    if(e-c>=3){const cells=[];for(let x=c;x<e;x++)cells.push(r*N+x);runs.push({dir:"h",cells});}c=e;}}
  for(let c=0;c<N;c++){let r=0;while(r<N){const t=grid[r][c];if(!t){r++;continue;}let e=r+1;
    while(e<N&&grid[e][c]&&grid[e][c].type===t.type)e++;
    if(e-r>=3){const cells=[];for(let y=r;y<e;y++)cells.push(y*N+c);runs.push({dir:"v",cells});}r=e;}}
  const owner=new Map(), groups=[];
  for(const run of runs){
    let g=null;
    for(const k of run.cells){const o=owner.get(k);if(o&&o!==g){
      if(!g)g=o;else{for(const kk of o.keys){g.keys.add(kk);owner.set(kk,g);}g.runs.push(...o.runs);o.dead=true;}
    }}
    if(!g){g={keys:new Set(),runs:[]};groups.push(g);}
    g.runs.push(run);for(const k of run.cells){g.keys.add(k);owner.set(k,g);}
  }
  return groups.filter(g=>!g.dead);
}

/* ---------- Resolve pipeline ---------- */
async function resolve(groups,swapped){
  let chain=0;
  while(groups.length){
    chain++;const mult=Math.min(chain,5);
    const protect=new Set(), creations=[];let bonus=0;
    const ok=k=>{const t=tileAt(k);return t&&!t.special&&!protect.has(k);};
    for(const g of groups){
      const lt=g.runs.some(x=>x.dir==="h")&&g.runs.some(x=>x.dir==="v");
      const longest=g.runs.reduce((a,b)=>b.cells.length>a.cells.length?b:a);
      let kind=null;
      g.bonus=0;
      if(g.keys.size>=5||lt){kind="burst";bonus+=50;g.bonus=50;}else if(longest.cells.length===4){kind=longest.dir;bonus+=20;g.bonus=20;}
      if(!kind)continue;
      let pos=null;
      if(swapped)for(const t of swapped){const k=t.r*N+t.c;if(g.keys.has(k)&&ok(k)){pos=k;break;}}
      if(pos===null&&lt)for(const k of g.keys){if(g.runs.filter(x=>x.cells.includes(k)).length>1&&ok(k)){pos=k;break;}}
      if(pos===null){const k=longest.cells[(longest.cells.length-1)>>1];if(ok(k))pos=k;}
      if(pos===null)for(const k of g.keys)if(ok(k)){pos=k;break;}
      if(pos!==null){protect.add(pos);creations.push({t:tileAt(pos),kind});}
    }
    const keysAll=[];for(const g of groups)for(const k of g.keys)keysAll.push(k);
    let o=null;
    if(swapped){const s=swapped.find(t=>keysAll.includes(t.r*N+t.c));if(s)o=[s.r,s.c];}
    if(!o){let sr=0,sc=0;for(const k of keysAll){sr+=(k/N)|0;sc+=k%N;}o=[sr/keysAll.length,sc/keysAll.length];}
    const dist=(k,a)=>Math.abs(((k/N)|0)-a[0])+Math.abs(k%N-a[1]);
    const clear=new Map();
    for(const k of keysAll)if(!protect.has(k)&&!clear.has(k))clear.set(k,Math.round(Math.min(dist(k,o),5)*15));
    const queue=[...clear.keys()].filter(k=>tileAt(k).special), fired=new Set();
    while(queue.length){
      const k=queue.shift();if(fired.has(k))continue;fired.add(k);
      const t=tileAt(k), base=clear.get(k), r=t.r, c=t.c, cells=[];
      if(t.special==="h"){for(let x=0;x<N;x++)cells.push(r*N+x);fxBeam("h",r,c,base,t.type);}
      else if(t.special==="v"){for(let y=0;y<N;y++)cells.push(y*N+c);fxBeam("v",c,r,base,t.type);}
      else{for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&cc>=0&&rr<N&&cc<N)cells.push(rr*N+cc);}
        fxRing(r,c,base,t.type);burstP([ctr(k)],t.type,14,base+30,1.45);}
      {const kind=t.special==="burst"?"burst":"line", col=c;
        if(base>0)setTimeout(()=>sound("special",kind,col),base);else sound("special",kind,col);}
      for(const kk of cells){
        if(protect.has(kk)||clear.has(kk)||!tileAt(kk))continue;
        clear.set(kk,Math.min(base+dist(kk,[r,c])*15,150));
        if(tileAt(kk).special)queue.push(kk);
      }
    }
    // score + time
    const pts=(clear.size+creations.length)*10*mult+bonus;
    addScore(pts);
    // per-group feedback: "+N" split by group (sums to pts), glow ring, particles, match hook
    const inGroup=new Set();let gsum=0;
    const gi=groups.map(g=>{
      const keys=[...g.keys], type=tileAt(keys[0]).type;let sx=0,sy=0,scol=0,d0=Infinity;const pts2=[];
      for(const k of keys){inGroup.add(k);const p=ctr(k);sx+=p[0];sy+=p[1];scol+=k%N;if(clear.has(k)){d0=Math.min(d0,clear.get(k));pts2.push(p);}}
      const gp=keys.length*10*mult+(g.bonus||0);gsum+=gp;
      return {type,size:keys.length,col:scol/keys.length,x:sx/keys.length,y:sy/keys.length,d0:isFinite(d0)?d0:0,pts:gp,cpts:pts2.length?pts2:[[sx/keys.length,sy/keys.length]]};
    });
    if(gi.length){let bi=0;gi.forEach((g,i)=>{if(g.size>gi[bi].size)bi=i;});gi[bi].pts+=pts-gsum;}
    if(gi.length){let bi=0,dm=Infinity;gi.forEach((g,i)=>{if(g.size>gi[bi].size)bi=i;dm=Math.min(dm,g.d0);});
      if(chain<2)hideToast();
      showPts(pts,gi[bi].type,chain,dm+70);}
    gi.forEach((g,i)=>{
      fxGlow(g.x,g.y,g.type,g.size,g.d0);
      burstP(g.cpts,g.type,6+Math.min(4,g.size-3),g.d0+55,1);
      sound("match",g.size,chain,g.col);
    });
    for(const [k,d] of clear)if(!inGroup.has(k)){const t=tileAt(k);burstP([ctr(k)],t.type,1,d+55,.9);}  // one spark per special-cleared tile
    let tb=0;for(const cr of creations)tb+=cr.kind==="burst"?3:2;if(chain>=3)tb+=1;
    if(tb&&started&&!timeUp)addTime(tb);
    log.push({chain,clear:[...clear.keys()].sort((a,b)=>a-b),fired:[...fired],made:creations.map(c=>[c.t.r*N+c.t.c,c.kind]),pts,tb:started&&!timeUp?tb:0,at:performance.now()|0});if(log.length>40)log.shift();
    const big=fired.size||creations.length;
    buzz(big||chain>=3?[12,30,12]:10);
    if(chain>=2){toast(WORDS[Math.min(chain,5)]+" ×"+mult,chain);sound("combo",chain);if(chain>=3)comboFx(chain);}
    // animate
    let maxD=0;
    for(const [k,d] of clear){const t=tileAt(k);grid[t.r][t.c]=null;if(t===sel)sel=null;clearAnim(t,d);maxD=Math.max(maxD,d);}
    for(const cr of creations){setSpecial(cr.t,cr.kind);spawnSpecialAnim(cr.t);sound("create",cr.kind==="burst"?"burst":"line",cr.t.c);}
    await wait(RM?120:110+maxD);
    await wait(collapse());
    groups=findMatches();swapped=null;
  }
}
function collapse(){
  const list=[];
  for(let c=0;c<N;c++){
    let w=N-1, order=0;
    for(let r=N-1;r>=0;r--){const t=grid[r][c];if(!t)continue;
      if(r!==w){grid[w][c]=t;grid[r][c]=null;list.push({t,from:r,order:order++});t.r=w;}w--;}
    const miss=w+1;
    for(let k=miss-1;k>=0;k--){const t=newTile(ri(NT),k,c);grid[k][c]=t;list.push({t,from:k-miss,order:order++,spawn:true});}
  }
  return animateDrops(list);
}
async function trySwap(a,b){
  if(!canInput())return;
  busy=true;poke();deselect();setHover(null);started=true;
  swapGrid(a,b);
  const groups=findMatches();
  const mid=(a.c+b.c)/2;  // board columns (a/b positions are swapped here, midpoint is unchanged)
  sound("swap",mid);
  if(!groups.length){
    sound("invalid",mid);buzz(15);
    await swapMove(a,b,110,EO,.7);swapGrid(a,b);await swapMove(a,b,160,SS,.35);
    if(!RM)for(const t of [a,b])t.inn.animate([{transform:"translateX(0)"},{transform:"translateX(3px)"},{transform:"translateX(-3px)"},{transform:"translateX(3px)"},{transform:"translateX(-3px)"},{transform:"translateX(0)"}],{duration:120});
    busy=false;poke();
    if(timeUp)gameOver();
    return;
  }
  await swapMove(a,b,140,EO,1);
  await resolve(groups,[a,b]);
  settleFx();sound("settle");
  busy=false;
  await afterSettle();
}
async function afterSettle(){
  poke();
  if(timeUp){gameOver();return;}
  if(!allMoves().length){busy=true;await reshuffle();busy=false;poke();}
}
async function reshuffle(){
  shuffling=true;toast("Shuffling…");
  const tiles=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)tiles.push(grid[r][c]);
  const outs=tiles.map(t=>t.inn.animate(RM?[{opacity:1},{opacity:0}]:[{transform:"scale(1)",opacity:1},{transform:"scale(0)",opacity:0}],{duration:RM?120:150,easing:EI,fill:"forwards"}));
  await wait(RM?120:150);
  let ok=false;
  for(let i=0;i<200&&!ok;i++){
    for(let j=tiles.length-1;j>0;j--){const k=ri(j+1);const x=tiles[j];tiles[j]=tiles[k];tiles[k]=x;}
    tiles.forEach((t,idx)=>{t.r=(idx/N)|0;t.c=idx%N;grid[t.r][t.c]=t;});
    ok=!findMatches().length&&allMoves().length>0;
  }
  if(!ok){const g=genBoard();tiles.forEach(t=>{t.type=g[t.r][t.c];styleType(t);setSpecial(t,null);});}
  tiles.forEach(t=>move(t,0));
  // soft clatter as the set pops back in: a few light, staggered clacks spread across the board
  [1,6,3,4,0,7].forEach((col,i)=>setTimeout(()=>sound("land",col,2+(i%3)*2,.12),i*24));
  tiles.forEach(t=>t.inn.animate(RM?[{opacity:0},{opacity:1}]:[{transform:"scale(0)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:RM?120:150,easing:SP}));
  outs.forEach(a=>a.cancel());
  await wait(RM?120:150);
  shuffling=false;
}
function buildBoard(){
  tilesEl.textContent="";sel=null;
  const g=genBoard(), list=[];
  for(let c=0;c<N;c++)for(let r=N-1;r>=0;r--){const t=newTile(g[r][c],r,c);grid[r][c]=t;list.push({t,from:r-N,order:N-1-r,spawn:true});}
  return animateDrops(list);
}

/* ---------- Input ---------- */
function cellFromEvent(e){
  const rect=boardEl.getBoundingClientRect();
  const c=Math.floor((e.clientX-rect.left-PAD+GAP/2)/PITCH), r=Math.floor((e.clientY-rect.top-PAD+GAP/2)/PITCH);
  return r<0||c<0||r>=N||c>=N?null:[r,c];
}
function release(){if(down){down.t.el.classList.remove("pr");down=null;}}
function select(t){deselect();sel=t;t.el.classList.add("sel");sound("select",t.c);buzz(8);}
function deselect(){if(sel){sel.el.classList.remove("sel");sel=null;}}
function tap(t){
  if(!canInput())return;
  if(!sel){select(t);return;}
  if(sel===t){deselect();return;}
  if(Math.abs(sel.r-t.r)+Math.abs(sel.c-t.c)===1){const a=sel;deselect();trySwap(a,t);}
  else select(t);
}
boardEl.addEventListener("pointerdown",e=>{
  if(e.button>0)return;poke();
  if(!canInput())return;
  const rc=cellFromEvent(e);if(!rc)return;const t=grid[rc[0]][rc[1]];if(!t)return;
  e.preventDefault();
  try{boardEl.setPointerCapture(e.pointerId);}catch(_){}
  release();down={t,x:e.clientX,y:e.clientY,id:e.pointerId};t.el.classList.add("pr");
  if(cur){cur=null;curEl.hidden=true;}
});
boardEl.addEventListener("pointermove",e=>{
  if(!down||e.pointerId!==down.id)return;
  const dx=e.clientX-down.x, dy=e.clientY-down.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<CELL*.3)return;
  const t=down.t;release();
  let r=t.r,c=t.c;
  if(Math.abs(dx)>Math.abs(dy))c+=dx>0?1:-1;else r+=dy>0?1:-1;
  if(r<0||c<0||r>=N||c>=N)return;
  const b=grid[r][c];if(b)trySwap(t,b);

const sheet=$("sheet"), scrim=$("scrim");

const setSY=y=>{sy=y;sheet.style.transform="translate3d(0,"+y+"px,0)";};
function springTo(target,v0){
  cancelAnimationFrame(sRaf);sv=v0||0;let lt=performance.now();
  const step=now=>{
    const dt=Math.min((now-lt)/1000,1/60);lt=now;
    const F=-380*(sy-target)-32*sv;sv+=F*dt;setSY(sy+sv*dt);
    if(Math.abs(sv)<10&&Math.abs(sy-target)<.5){setSY(target);return;}
    sRaf=requestAnimationFrame(step);
  };
  sRaf=requestAnimationFrame(step);
}
function openSheet(){
  scrim.hidden=false;sheet.hidden=false;

  if(RM){setSY(0);sheet.animate([{opacity:0},{opacity:1}],{duration:120});return;}
  setSY(sheet.offsetHeight||320);springTo(0);

function closeSheet(cb){

  const kf=RM?[{opacity:1},{opacity:0}]:[{transform:"translate3d(0,"+sy+"px,0)"},{transform:"translate3d(0,100%,0)"}];
  const a=sheet.animate(kf,{duration:RM?120:220,easing:EI,fill:"forwards"});
  scrim.animate([{opacity:.4},{opacity:0}],{duration:RM?120:220,fill:"forwards"}).onfinish=function(){this.cancel();};

  if(cb)cb();
}

function endDrag(e){

  unlockAudio();closeSheet();newGame();state="play";sound("start");poke();$("againBtn").blur();
});
$("shareBtn").addEventListener("click",async()=>{
  const text="I scored "+fmt(score)+" in Snap Match!";
  try{if(navigator.share){await navigator.share({title:"Snap Match",text});return;}}catch(e){return;}
  try{await navigator.clipboard.writeText(text);toast("Copied");}catch(e){toast(text);}
});

/* ---------- Main loop ---------- */
let lastT=performance.now(), shownSec=-1;
function renderTimer(){
  barEl.style.transform="scaleX("+Math.min(1,timeLeft/60000)+")";
  const s=Math.ceil(timeLeft/1000);
  if(s!==shownSec){
    shownSec=s;timeEl.textContent=s;
    const low=started&&timeLeft<10000&&timeLeft>0;
    hudEl.classList.toggle("low",low);trackEl.classList.toggle("low-bar",low);
    if(low&&state==="play")sound("tick");
    if(low&&!RM){
      trackEl.animate([{transform:"scale(1)"},{transform:"scale(1.03)"},{transform:"scale(1)"}],{duration:150,easing:EO});
      timeEl.animate([{transform:"scale(1)"},{transform:"scale(1.12)"},{transform:"scale(1)"}],{duration:150,easing:EO});
    }
  }
}
function loop(now){
  const dt=Math.min(now-lastT,100);lastT=now;
  if(state==="play"&&started&&!shuffling&&!timeUp){
    timeLeft-=dt;
    if(timeLeft<=0){timeLeft=0;timeUp=true;deselect();release();if(!busy)gameOver();}
  }
  renderTimer();
  if(tw){
    const p=Math.min(1,(now-tw.t0)/tw.d), e=1-Math.pow(1-p,3), v=Math.round(tw.from+(tw.to-tw.from)*e);
    if(v!==shown){shown=v;scoreEl.textContent=fmt(v);updateBestHud();}
    if(p>=1)tw=null;
  }
  if(state==="play"&&!busy&&!shuffling&&!timeUp&&now-lastInput>5000&&now-lastHint>4000){lastHint=now;showHint();}
  requestAnimationFrame(loop);
}

/* ---------- Init ---------- */
function init(){
  const minis=$("minis");
  for(let i=0;i<NT;i++){const t=newTile(i,0,0);minis.appendChild(t.el);}
  setMuteUI();sound("setMuted",muted);
  readColors();
  try{const cm=window.matchMedia("(prefers-color-scheme: dark)");cm.addEventListener("change",()=>requestAnimationFrame(readColors));}catch(e){}
  computeTileSize();
  window.addEventListener("resize",onResize);
  window.addEventListener("orientationchange",onResize);
  updateBestHud();
  busy=true;const d=buildBoard();setTimeout(()=>{busy=false;},d);
  showStart();
  requestAnimationFrame(loop);
  window.SnapMatch={
    moves:allMoves,
    setTime:ms=>{timeLeft=ms;},
    board:()=>grid.map(row=>row.map(t=>t?t.type+(t.special?t.special[0]:""):".")),
    log:()=>log.slice(),
    swap:(r1,c1,r2,c2)=>{const a=grid[r1]&&grid[r1][c1],b=grid[r2]&&grid[r2][c2];return a&&b&&Math.abs(r1-r2)+Math.abs(c1-c2)===1?trySwap(a,b):false;},
    setBoard:g=>{
      if(state!=="play"||!canInput())return false;
      clearHint();deselect();tilesEl.textContent="";log.length=0;
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=String(g[r][c]),t=newTile(+v[0]%NT,r,c);
        setSpecial(t,{b:"burst",h:"h",v:"v"}[v[1]]||null);grid[r][c]=t;tilesEl.appendChild(t.el);move(t,0);}
      afterSettle();return true;
    },
    info:()=>({bw:BW,state,score,timeLeft,busy,shuffling,started,filled:grid.flat().filter(Boolean).length,dom:tilesEl.children.length,pad:PAD,pitch:PITCH,cell:CELL,
      particles:pool.filter(p=>p.on).length,fxNodes:fxEl.children.length-1})
  };
}
init();
})();
</script>
